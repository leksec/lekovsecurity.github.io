<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <meta content="Thank you for contacting Lekov Security." name="description"/>
        <meta content="#070908" name="theme-color"/>
        <title>Thank You – Lekov Security</title>
        <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
        <link href="https://fonts.googleapis.com" rel="preconnect"/>
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
        <link href="/assets/css/main.css" rel="stylesheet"/>
        <link href="/assets/css/thanks.css" rel="stylesheet"/>
    </head>
    <body class="thanks-page">
        <div class="thanks-noise" aria-hidden="true"></div>
        <div class="thanks-grid" aria-hidden="true"></div>

        <header class="thanks-header">
            <div class="thanks-header-inner">
                <a class="thanks-brand" href="/" aria-label="Lekov Security home">
                    <span class="thanks-brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 40 40">
                            <path class="thanks-shield" d="M20 4.8L32 9.5V18.8C32 26.4 27.2 32.4 20 35.3C12.8 32.4 8 26.4 8 18.8V9.5L20 4.8Z"></path>
                            <circle class="thanks-target-ring" cx="20" cy="19.2" r="6.4"></circle>
                            <path class="thanks-crosshair" d="M20 9.9V14.3M20 24.1V28.5M10.7 19.2H15.1M24.9 19.2H29.3"></path>
                            <circle class="thanks-target-core" cx="20" cy="19.2" r="1.6"></circle>
                        </svg>
                    </span>
                    <span>LEKOV SECURITY</span>
                </a>
                <a class="thanks-home-link" href="/">Back to website</a>
            </div>
        </header>

        <main class="thanks-main">
            <section class="thanks-card" aria-labelledby="thanks-title">
                <div class="thanks-status">
                    <span class="thanks-status-dot" aria-hidden="true"></span>
                    MESSAGE RECEIVED
                </div>
                <div class="thanks-code" aria-hidden="true">200</div>
                <h1 id="thanks-title">Message received.</h1>
                <p>Thanks for getting in touch. We’ll review the details and get back to you as soon as possible.</p>
                <div class="thanks-actions">
                    <a class="thanks-primary" href="/">Return to the website <span aria-hidden="true">→</span></a>
                    <a class="thanks-secondary" href="/#services">View services</a>
                </div>
            </section>
        </main>

        <footer class="thanks-footer">
            <span>LEKOV SECURITY</span>
            <span class="thanks-footer-flag" aria-label="North Macedonia">🇲🇰</span>
            <span>© 2025–2026</span>
        </footer>
    </body>
</html>
